# 전량 검증 워크플로.
#
# `bash scripts/verify.sh` 하나를 돌린다. 검사 목록을 여기에 다시 적지 않는 이유는
# 그러면 스크립트와 워크플로가 갈리기 때문이며, 어느 단계가 도는지는 스크립트가 든다.
#
# **이 워크플로를 고쳐 통과시키지 않는다.** 검사가 실패하면 그 실패가 산출물이다
# (CLAUDE.md §5). 수정이 필요해 보이면 실행하지 말고 보고한다.
#
# 캐시의 경로는 툴체인 관리자의 홈과 의존 패키지 디렉터리 둘이다. 프로젝트 자신의
# 빌드 산출은 `.lake/build` 에 서고 의존 패키지의 산출은 `.lake/packages` 아래 각
# 패키지의 빌드 디렉터리에 서므로, 패키지 디렉터리를 경로로 두는 것이 프로젝트 자신의
# 산출을 구조적으로 뺀다. 제외를 양식으로 열거하면 새 산출이 그 열거 밖에 남을 수
# 있고 그 빠짐을 재는 자리가 없는데, 경로로 가르면 캐시가 그 산출을 담을 수단 자체가
# 없어진다.
#
# 캐시 키는 핀의 정본 파일의 내용 해시에서 유도하고 판을 여기에 적지 않는다. 올리언이
# 툴체인마다 달라지므로 패키지의 키가 툴체인 파일을 함께 받는다. 부분 적중을 받는 보조
# 키를 두지 않는 이유는 잠금 명세와 맞지 않는 패키지 묶음이 복원되면 빌드 도구가 그것을
# 다시 맞추게 되고, 핀의 정본이 `lean-toolchain` 과 `lake-manifest.json` 이라는 요구가
# 그 재조정을 금지하는 쪽에 서기 때문이다.

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 툴체인 캐시 복원
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: elan 설치
        # 적중이면 그 홈 디렉터리 전량이 복원되어 이 단계가 할 일이 없고, 원격 문면을
        # 받는 의존도 그 자리에서 함께 사라진다. 툴체인 판은 lean-toolchain 이 든다.
        # 여기에 판을 적지 않는 이유는 핀의 정본이 그 파일이고 전사가 낡기 때문이다
        # (docs/baseline.md §1).
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none

      - name: elan 실행 경로 등록
        # 설치와 경로 등록을 가른다. 적중에서 앞 단계를 건너뛰므로 이 등록이 그 단계에
        # 함께 들어 있으면 뒤의 단계가 그 관리자를 찾지 못한다.
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 툴체인 확인
        run: |
          lean --version
          lake --version

      - name: 의존 패키지 캐시 복원
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Mathlib 캐시 내려받기
        # 실패하면 여기서 멈춘다. 로컬 전량 빌드로 넘어가지 않는다 (CLAUDE.md §1-3).
        # Mathlib 전량 빌드는 몇 시간이 걸리고 캐시 미스는 대개 다른 문제의 신호다.
        # 조건 없이 돌린다. 적중한 판에서는 받을 것이 없어 빠르게 지나가고 빗나간
        # 판에서는 이 단계가 실제 일을 한다.
        run: lake exe cache get

      - name: 프로젝트 빌드 산출이 캐시에서 오지 않았음을 잰다
        # 올리언을 지우고 다시 세우는 단계의 뜻이 디스크 내용 기준 재검증이므로 그
        # 전제가 이 자리에서 서야 한다. 그 삭제가 모듈 디렉터리와 그 모듈 파일만
        # 받으므로 중간 표현의 산출처럼 그 밖에 서는 자리가 복원되면 빌드 도구가 추적
        # 파일을 보고 일을 건너뛸 수 있고, 그 어긋남이 그 단계의 뜻을 조용히 비운다.
        # 그래서 빌드 디렉터리 아래에서 프로젝트 이름을 품은 경로 전량을 본다.
        #
        # 성패를 출력을 흘려 보내는 축약 판정으로 받지 않고 출력 전량을 파일로 받아
        # 적발의 계수를 잰다. 파이프의 오른쪽이 첫 일치에서 끝나면 왼쪽에 신호가 가고
        # 파이프 전체의 종료 코드가 비영이 되어 판정이 뒤집히기 때문이다.
        run: |
          find .lake/build -path '*CrisisFramework*' > /tmp/cache_guard.txt 2>/dev/null || true
          n=$(wc -l < /tmp/cache_guard.txt)
          if [ "$n" -gt 0 ]; then
            head -20 /tmp/cache_guard.txt
            echo "프로젝트 자신의 빌드 산출이 캐시 복원 뒤에 ${n} 줄 서 있다." >&2
            echo "캐시 경로가 .lake/build 를 덮는지 확인하고 고쳐 통과시키지 말고 보고한다." >&2
            exit 1
          fi
          echo "빌드 디렉터리 아래에 프로젝트 이름을 품은 경로 0 줄"

      - name: 전량 검증
        run: bash scripts/verify.sh
